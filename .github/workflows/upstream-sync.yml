name: Upstream Sync

# Keep this fork's default branch in sync with the upstream repo it was forked
# from, and — whenever new commits land — ask Claude to port any newly added
# Windows-only code to the macOS/Linux cross-platform layer (src/platform.*)
# and open a pull request.
#
# Runs on a daily schedule and can be triggered manually.
#
# Configuration:
#   - Secret  ANTHROPIC_API_KEY      : required for the auto-port step. A Claude
#                                       Code OAuth token works too — set it as
#                                       CLAUDE_CODE_OAUTH_TOKEN and swap the input
#                                       below. Without it, the workflow still
#                                       syncs and opens a summary issue instead.
#   - Var     UPSTREAM_REPO (opt.)   : owner/repo to sync from. Defaults to the
#                                       fork's parent (auto-detected).
#   - Var     UPSTREAM_BRANCH (opt.) : upstream branch. Defaults to its default
#                                       branch.
on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream repo/branch
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP="${{ vars.UPSTREAM_REPO }}"
          if [ -z "$UP" ]; then
            UP=$(gh api "repos/${{ github.repository }}" --jq '.parent.full_name // empty')
          fi
          if [ -z "$UP" ]; then
            echo "::error::No upstream found. This repo is not a fork; set the UPSTREAM_REPO variable (owner/repo)."
            exit 1
          fi
          BR="${{ vars.UPSTREAM_BRANCH }}"
          if [ -z "$BR" ]; then
            BR=$(gh api "repos/$UP" --jq '.default_branch')
          fi
          echo "repo=$UP"   >> "$GITHUB_OUTPUT"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          echo "Upstream: $UP@$BR -> ${{ github.repository }}@${{ github.ref_name }}"

      - name: Check drift and sync
        id: sync
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${{ steps.up.outputs.repo }}.git"
          git fetch --no-tags upstream "${{ steps.up.outputs.branch }}"

          BEHIND=$(git rev-list --count "HEAD..upstream/${{ steps.up.outputs.branch }}")
          echo "Behind upstream by $BEHIND commit(s)."
          if [ "$BEHIND" -eq 0 ]; then
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do."
            exit 0
          fi

          BEFORE=$(git rev-parse HEAD)

          # Prefer a clean fast-forward; fall back to a merge commit. If the
          # merge conflicts, abort and leave the branch untouched (reported).
          if git merge --ff-only "upstream/${{ steps.up.outputs.branch }}"; then
            echo "Fast-forwarded."
          elif git merge --no-edit "upstream/${{ steps.up.outputs.branch }}"; then
            echo "Merged upstream (merge commit)."
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "synced=false"  >> "$GITHUB_OUTPUT"
            echo "::error::Merge from upstream conflicts; manual resolution needed."
            exit 1
          fi

          git push origin "HEAD:${{ github.ref_name }}"
          AFTER=$(git rev-parse HEAD)

          echo "synced=true"          >> "$GITHUB_OUTPUT"
          echo "before=$BEFORE"       >> "$GITHUB_OUTPUT"
          echo "after=$AFTER"         >> "$GITHUB_OUTPUT"
          echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"

      - name: Collect changed platform-relevant files
        id: diff
        if: steps.sync.outputs.synced == 'true'
        run: |
          RANGE="${{ steps.sync.outputs.range }}"
          {
            echo "## New upstream commits"
            git log --oneline "$RANGE"
            echo
            echo "## Changed build/source files"
            git diff --stat "$RANGE" -- src/ CMakeLists.txt build.bat || true
          } > sync-summary.md
          cat sync-summary.md
          # Expose whether any C/C++/build files actually changed
          if git diff --quiet "$RANGE" -- src/ CMakeLists.txt; then
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Claude credentials
        id: creds
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi

      # ── Primary path: Claude ports the new Windows-only code and opens a PR ──
      - name: Port new changes to macOS/Linux with Claude
        if: steps.sync.outputs.synced == 'true' && steps.diff.outputs.code_changed == 'true' && steps.creds.outputs.have == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            The fork's `${{ github.ref_name }}` branch was just synced with upstream
            ${{ steps.up.outputs.repo }}@${{ steps.up.outputs.branch }}. The newly merged
            commits are in the range ${{ steps.sync.outputs.range }}.

            This project already builds on Windows, macOS and Linux from one source. The
            cross-platform layer lives in `src/platform.h` / `src/platform.cpp` and the
            established porting pattern is:
              - Windows keeps its native code inside `#ifdef _WIN32`.
              - POSIX gets an `#else`/`#ifndef _WIN32` branch: BSD-socket shims
                (SOCKET/INVALID_SOCKET/closesocket), `executable_dir()`/`exe_relative()`,
                `open_url()`, `restart_self()`, and the curl-based `http_post()` for
                HTTPS (system TLS, no linked libs).
              - `select()` uses `maxfd+1`, casts use `unsigned short`, `NOMINMAX` guards
                the Windows headers, and codex-home resolution falls back to `$HOME`.
              - CMake links Threads on POSIX and avoids `-static` on Apple.

            Review only what changed in ${{ steps.sync.outputs.range }} (see the diff for
            `src/` and `CMakeLists.txt`). If any of it introduces Windows-only APIs
            (WinHTTP, WinSock, windows.h calls, ShellExecute, GetModuleFileName, etc.),
            port it to macOS/Linux following the pattern above, keeping the Windows path
            intact. Then verify the POSIX build compiles:
              cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j

            When you have changes, open a pull request against `${{ github.ref_name }}`
            on a new branch named `claude/upstream-port-${{ steps.sync.outputs.after }}`,
            summarizing what you ported and how you verified it. If nothing in the synced
            range is platform-specific, make no changes and open no PR.
          claude_args: '--max-turns 40'

      # ── Fallback: no API key configured → open an informational issue ──
      - name: Open porting issue (no Claude credentials)
        if: steps.sync.outputs.synced == 'true' && steps.diff.outputs.code_changed == 'true' && steps.creds.outputs.have == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@claude The default branch was synced with upstream (\`${{ steps.sync.outputs.range }}\`)."
            echo "Please port any new Windows-only code to the \`src/platform\` layer and open a PR."
            echo
            echo "> Set the \`ANTHROPIC_API_KEY\` secret to have this run automatically on each sync."
            echo
            cat sync-summary.md
          } > issue-body.md
          gh issue create \
            --title "Sync ${{ steps.sync.outputs.after }}: port new upstream changes to macOS/Linux" \
            --body-file issue-body.md

      - name: Report
        if: always()
        run: |
          echo "synced=${{ steps.sync.outputs.synced }}"
          echo "code_changed=${{ steps.diff.outputs.code_changed }}"
          echo "claude_creds=${{ steps.creds.outputs.have }}"
